# ---------- Banco de dados MySQL ----------
# O banco "autofix_spring" é criado sozinho se não existir.
spring.datasource.url=jdbc:mysql://localhost:3306/autofix_spring?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=univille

# ---------- JPA / Hibernate ----------
# "update" = o Hibernate cria e ajusta as tabelas a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---------- Aplicação ----------
spring.application.name=autofix
server.port=8080
