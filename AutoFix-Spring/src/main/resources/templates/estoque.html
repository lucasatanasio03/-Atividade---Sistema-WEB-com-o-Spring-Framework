<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Estoque')}"></head>
<body>
<header th:replace="~{fragmentos :: menu('estoque')}"></header>

<main>
    <h2>Estoque de Peças</h2>
    <div th:replace="~{fragmentos :: mensagens}"></div>
    <p class="mensagem alerta" th:if="${alertas > 0}"
       th:text="'Atenção: ' + ${alertas} + ' peça(s) com estoque baixo ou zerado!'"></p>

    <form th:action="@{/estoque/salvar}" th:object="${peca}" method="post" class="formulario">
        <input type="hidden" th:field="*{id}">
        <label>Código
            <input type="text" th:field="*{codigo}" required>
        </label>
        <label>Descrição
            <input type="text" th:field="*{descricao}" required>
        </label>
        <label>Quantidade em estoque
            <input type="number" th:field="*{quantidade}" min="0" required>
        </label>
        <label>Estoque mínimo
            <input type="number" th:field="*{minimo}" min="0" required>
        </label>
        <label>Preço de venda (R$)
            <input type="number" th:field="*{preco}" step="0.01" min="0.01" required>
        </label>
        <div class="botoes">
            <button type="submit">Salvar</button>
            <a class="botao" th:href="@{/estoque}">Novo</a>
        </div>
    </form>

    <form th:action="@{/estoque}" method="get" class="busca">
        <input type="text" name="busca" th:value="${busca}" placeholder="Buscar por código ou descrição">
        <button type="submit">Buscar</button>
    </form>

    <table>
        <thead>
        <tr><th>Código</th><th>Descrição</th><th>Qtd</th><th>Mínimo</th><th>Preço</th><th>Situação</th><th>Ações</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${lista}"
            th:class="${p.situacao == 'ZERADO'} ? 'zerado' : (${p.situacao == 'BAIXO'} ? 'baixo')">
            <td th:text="${p.codigo}"></td>
            <td th:text="${p.descricao}"></td>
            <td th:text="${p.quantidade}"></td>
            <td th:text="${p.minimo}"></td>
            <td th:text="${@fmt.moeda(p.preco)}"></td>
            <td th:text="${p.situacao}"></td>
            <td class="acoes">
                <a class="botao" th:href="@{/estoque(editar=${p.id})}">Editar</a>
                <form th:action="@{/estoque/{id}/excluir(id=${p.id})}" method="post"
                      onsubmit="return confirm('Excluir esta peça?')">
                    <button type="submit" class="perigo">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(lista)}"><td colspan="7" class="vazio">Nenhuma peça encontrada.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
